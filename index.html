<!doctype html><html><head><meta charset="utf-8"><title>午饭转盘</title>
<style>body{font-family:sans-serif;text-align:center;background:#fff8ee}#w{transition:transform 4s cubic-bezier(.17,.67,.12,1)}button{font-size:20px;padding:8px 24px;margin:10px}</style></head><body>
<h1>🍜 中午吃什么？</h1><input id="opts" size="60" value="拉面,寿司,麻辣烫,汉堡,饺子,咖喱饭,沙拉,火锅"><br>
<button onclick="spin()">转！</button><h2 id="r">&nbsp;</h2><div style="position:relative;display:inline-block">
<div style="position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:30px;z-index:2">▼</div><svg id="w" width="360" height="360" viewBox="-180 -180 360 360"></svg></div><script>
let rot=0;const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f1c','#2ec4b6','#e71d36'];
function opts(){return document.getElementById('opts').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)}
function draw(){const o=opts(),n=o.length,w=document.getElementById('w');let h='';o.forEach((t,i)=>{const a=i/n*2*Math.PI-Math.PI/2,b=(i+1)/n*2*Math.PI-Math.PI/2,m=(a+b)/2;
h+=`<path d="M0 0L${170*Math.cos(a)} ${170*Math.sin(a)}A170 170 0 ${n<2?1:0} 1 ${170*Math.cos(b)} ${170*Math.sin(b)}Z" fill="${cols[i%8]}"/><text x="${110*Math.cos(m)}" y="${110*Math.sin(m)}" text-anchor="middle" dominant-baseline="middle" font-size="16">${t}</text>`});w.innerHTML=h}
function spin(){draw();const o=opts(),n=o.length,i=Math.random()*n|0;const target=360-((i+.5)/n*360);rot+=1800+((target-rot%360)+360)%360;
document.getElementById('w').style.transform=`rotate(${rot}deg)`;setTimeout(()=>r.textContent='今天就吃：'+o[i]+' 🎉',4000)}
document.getElementById('opts').oninput=draw;draw();
</script></body></html>
